version: 1.3.13

cache: true

endpoints:
  custom:
    - name: "MyAPI World"
      apiKey: "${MYAPI_KEY}"
      baseURL: "https://api.myapi.world/v1" # Αν το API σου δεν χρειάζεται το /v1 στο τέλος, αφαίρεσέ το
      models:
        default:
          - "GPT-5.6-Terra"
          - "GPT-5.6-Luna"
          - "GPT-5.6-SOL"
          - "Opus 5"
          - "GPT-5.5"
          - "Sonnet 5"
          - "Fable 5"
        fetch: false # Βάζουμε false για να μην προσπαθεί να φέρει άλλα μοντέλα και να φαίνονται ΜΟΝΟ αυτά
      titleConvo: true
      titleModel: "GPT-5.5"
      modelDisplayLabel: "MyAPI World"
