version: 1.3.13

cache: true

endpoints:
  # Απενεργοποίηση όλων των προεπιλεγμένων παρόχων
  openAI: null
  google: null
  anthropic: null
  gptPlugins: null

  # Μόνο ο δικός σου πάροχος
  custom:
    - name: "MyAPI World"
      apiKey: "${MYAPI_KEY}"
      baseURL: "https://api.myapi.world/v1"
      models:
        default:
          - "GPT-5.6-Terra"
          - "GPT-5.6-Luna"
          - "GPT-5.6-SOL"
          - "Opus 5"
          - "GPT-5.5"
          - "Sonnet 5"
          - "Fable 5"
        fetch: false # Εμποδίζει τη λήψη της τεράστιας λίστας από το API
      titleConvo: true
      titleModel: "GPT-5.5"
      modelDisplayLabel: "MyAPI World"
